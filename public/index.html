 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="topLine">MY FIRST WEB APP</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <h1 id="heading">My fullstack journey</h1>

    <p id="message">I am learning how the web works.</p>

    <button id="changeButton">CLICK ME</button>

    <p>Search Task</p>

    <input id="searchInput">



    <input type="radio" id="nothing" name="completedFilter" value="" checked>
    <label for="nothing">Nothing</label>

    <input type="radio" id="completed" name="completedFilter" value="true">
    <label for="completed">Completed</label>

    <input type="radio" id="notCompleted" name="completedFilter" value="false">
    <label for="notCompleted">Not Completed</label>


    <p>Add Task</p>

    <input id="taskInput" >

    <button id="addTaskButton">Add</button>

    <p id="errorMessageBox"></p>

    <div id="tasks"></div>

    <script type="module" src="script.js"></script>
 </body>
 </html>
